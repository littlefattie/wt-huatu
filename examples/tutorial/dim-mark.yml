# --- Draw --------
draw:
  - rect; -a-b, -b-c; a+b, b+c; ||| fill, #999, 0.2
  - rect; -a, -b; a,b; ||| fill, maroon, 0.3
  - circ; 0,0; 12 ||| fill, cc;
  - line; pdm11; pdm12 ||| stroke, 2, cc; marker; arrMk1;
  - line; pdm21; pdm22 ||| stroke, 2, cc; marker; arrMk1;
  - line; pdm31; pdm32 ||| stroke, 2, cc; marker; arrMk1;
  - line; pdm41; pdm42 ||| stroke, 2, cc; marker; arrMk1;

