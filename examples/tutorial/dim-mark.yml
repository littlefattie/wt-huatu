# Example WT-HUATU design file


# --- Vars ------
vars:
  a: 100
  b: 300
  c: 500
  rArc: 100

# --- Points ------
points:
  pdm11: a, b
  pdm12: a+b, b+c
  pdm21: a, -b
  pdm22: a+b, -b-c
  pdm31: -a, -b
  pdm32: -a-b, -b-c
  pdm41: -a, b
  pdm42: -a-b, b+c
  pcd1: -300, -300
  pcd2: -202, pcd1.y
  pcd3: pcd2.x + 102, pcd1.y
  pcd4: pcd3.x + 80, pcd1.y
  pcd5: 400, pcd1.y
  pcdy1: 0, -400
  pcdy2: pcdy1.x, pcdy1.y + 20
  pcdy3: pcdy1.x, pcdy2.y + 120
  pcdy4: pcdy1.x + 8, pcdy3.y + 42
  pcdy5: pcdy1.x - 4, pcdy4.y + 72

markers:
  arrMk1: arrow; len; 12; color; cc;

# --- Shapes ------
shapes:
  #c1: circle; pC1; a
  #c2: circle; pC2; b
  circ1: circ; pcdy1.x - rArc, pcdy1.y; rArc;
  arc1: arc; circ1; 0; -90; ccw;

pointSeries:
  #psPdm: pdm1; pdm2; pdm3; pdm4
  psPcd: pcd1; pcd2; pcd3; pcd4; pcd5;
  psPcdy: pcdy1; pcdy2; pcdy3; pcdy4; pcdy5;

